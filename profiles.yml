# Fivetran Transformations injects the destination connection details at run time,
# so nothing secret lives here. The values below are only used for local runs.
config:
  send_anonymous_usage_stats: false

tpcc_dbt:
  target: warehouse
  outputs:
    warehouse:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', 'placeholder.cloud.databricks.com') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '/sql/1.0/warehouses/placeholder') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', 'placeholder') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'main') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'tpcc_dbt') }}"
      threads: 4
